<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Typing Game</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eaf4ff, #ffffff);
      color: #1f2937;
    }

    .game {
      width: min(92%, 600px);
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #2563eb;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 20px 0;
    }

    .stat {
      flex: 1;
      background: #f3f7ff;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
    }

    .word {
      font-size: 42px;
      font-weight: bold;
      margin: 30px 0 20px;
      color: #111827;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      text-align: center;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .message {
      min-height: 28px;
      margin: 15px 0;
      font-weight: bold;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .button-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    #musicBtn {
      background: #7c3aed;
    }

    #musicBtn:hover {
      background: #6d28d9;
    }

    .instructions {
      margin-top: 18px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="game">
    <h1>English Typing Game</h1>
    <p>Type the English word correctly before time runs out.</p>

    <div class="stats">
      <div class="stat">Time: <span id="time">30</span>s</div>
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Mistakes: <span id="mistakes">0</span></div>
    </div>

    <div class="word" id="word">ready</div>

    <input
      type="text"
      id="typingInput"
      placeholder="Type the word here..."
      autocomplete="off"
      autofocus
    />

    <div class="message" id="message"></div>

    <div class="button-row">
      <button onclick="restartGame()">Restart Game</button>
      <button id="musicBtn" onclick="toggleMusic()">🎵 Music: Off</button>
    </div>

    <div class="instructions">
      Press Enter after typing each word.
    </div>
  </div>

  <script>
    const words = [
      "apple", "book", "school", "teacher", "student",
      "computer", "keyboard", "english", "language", "happy",
      "beautiful", "morning", "friend", "family", "water",
      "window", "garden", "music", "travel", "future",
      "success", "learn", "practice", "challenge", "quick",
      "bright", "simple", "creative", "strong", "wonderful"
    ];

    const wordElement = document.getElementById("word");
    const input = document.getElementById("typingInput");
    const scoreElement = document.getElementById("score");
    const mistakesElement = document.getElementById("mistakes");
    const timeElement = document.getElementById("time");
    const messageElement = document.getElementById("message");

    let currentWord = "";
    let score = 0;
    let mistakes = 0;
    let timeLeft = 30;
    let gameActive = true;
    let timer;

    function newWord() {
      currentWord = words[Math.floor(Math.random() * words.length)];
      wordElement.textContent = currentWord;
      input.value = "";
      input.focus();
    }

    function startTimer() {
      clearInterval(timer);

      timer = setInterval(() => {
        timeLeft--;
        timeElement.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          gameActive = false;
          input.disabled = true;
          wordElement.textContent = "Game Over!";
          messageElement.textContent = `Final score: ${score}`;
          messageElement.style.color = "#2563eb";
        }
      }, 1000);
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && gameActive) {
        const typedWord = input.value.trim().toLowerCase();

        if (typedWord === currentWord.toLowerCase()) {
          score++;
          scoreElement.textContent = score;
          messageElement.textContent = "Correct!";
          messageElement.style.color = "green";
        } else {
          mistakes++;
          mistakesElement.textContent = mistakes;
          messageElement.textContent = `Wrong! Correct word: ${currentWord}`;
          messageElement.style.color = "red";
        }

        newWord();
      }
    });

    let audioContext = null;
    let musicTimer = null;
    let musicPlaying = false;
    let noteIndex = 0;

    const melody = [
      261.63, 329.63, 392.00, 329.63,
      293.66, 349.23, 440.00, 349.23,
      329.63, 392.00, 493.88, 392.00,
      293.66, 349.23, 440.00, 349.23
    ];

    function playNote(frequency) {
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;

      gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.055, audioContext.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.28);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.3);
    }

    function startMusic() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      if (musicTimer) clearInterval(musicTimer);

      playNote(melody[noteIndex]);
      noteIndex = (noteIndex + 1) % melody.length;

      musicTimer = setInterval(() => {
        playNote(melody[noteIndex]);
        noteIndex = (noteIndex + 1) % melody.length;
      }, 350);

      musicPlaying = true;
      document.getElementById("musicBtn").textContent = "🔇 Music: On";
    }

    function stopMusic() {
      clearInterval(musicTimer);
      musicTimer = null;
      musicPlaying = false;
      document.getElementById("musicBtn").textContent = "🎵 Music: Off";
    }

    function toggleMusic() {
      if (musicPlaying) {
        stopMusic();
      } else {
        startMusic();
      }
    }

    function restartGame() {
      score = 0;
      mistakes = 0;
      timeLeft = 30;
      gameActive = true;

      scoreElement.textContent = score;
      mistakesElement.textContent = mistakes;
      timeElement.textContent = timeLeft;
      messageElement.textContent = "";

      input.disabled = false;

      newWord();
      startTimer();
    }

    restartGame();
  </script>

</body>
</html>
